services:
  # 1. The Database (PostgreSQL)
  db:
    image: postgres:15
    container_name: hospital_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: hospital_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hospital_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hospital_db"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  # 2. The Backend API (FastAPI)
  backend:
    build: ./backend
    container_name: hospital_backend
    command: sh -c "sleep 15 && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/hospital_db
      - JWT_SECRET_KEY=your-super-secret-key-change-in-production
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://frontend:5173
      - ENVIRONMENT=development
      # --- AI analysis layer (Groq / Llama 3) — values come from .env ---
      # .env is gitignored; see .env.example. MOCK_LLM defaults to true (demo-safe).
      # For the real LLM: put GROQ_API_KEY + MOCK_LLM=false in .env, rebuild backend.
      - MOCK_LLM=${MOCK_LLM:-true}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hospital_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 20s

  # 3. The AI Engine (Python Microservice)
  ai_engine:
    build: ./ai_engine
    container_name: hospital_ai_engine
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./ai_engine:/app
    ports:
      - "8001:8001"
    networks:
      - hospital_network

  # 4. The Frontend (React + Vite)
  frontend:
    build: ./frontend
    container_name: hospital_frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_started
    networks:
      - hospital_network

volumes:
  postgres_data:

networks:
  hospital_network:
    driver: bridge